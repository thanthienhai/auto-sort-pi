# Bảng mapping global: source label (từ bất kỳ public dataset nào) -> taxonomy
# class của auto-sort-pi. Đây là "nguồn sự thật" cho việc merge nhãn (§4, §5
# training_online_dataset.md).
#
# Key được so khớp sau khi chuẩn hóa (lowercase, "-"/"_"/"/" và khoảng trắng
# thừa đều gộp thành 1 space) — xem training/lib/mapping.py:normalize_label.
#
# QUY TẮC: một rule ở đây được ưu tiên HƠN auto-exact-match. Điều này bắt buộc
# để xử lý các trường hợp nguy hiểm như "Tin Can": dù trùng gần tên class
# `tin_can`, nó vẫn phải là REVIEW_REQUIRED vì nhãn gốc không đủ chắc chắn đó
# là lon thiếc chứ không phải lon nhôm/lon nói chung.
#
# mapping_type: EXACT | SAFE_ALIAS | REVIEW_REQUIRED
# REVIEW_REQUIRED thì target_class phải là null, dùng candidate_targets để gợi ý.

